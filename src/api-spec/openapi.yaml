openapi: 3.0.3
info:
  version: 0.1.0
  title: LibreWeather API
  contact:
    email: admin@libreweather.com
  license:
    name: AGPL v3.0
    url: 'https://opensource.org/licenses/AGPL-3.0'
paths:
  /weather:
    get:
      deprecated: true
      summary: Get the weather data for a given latitude and longitude.
      parameters:
        - in: header
          name: x-libreweather-token
          schema:
            type: string
          description: API Access token
          required: false
        - in: header
          name: x-latitude
          schema:
            type: number
          description: Latitude value for location
          required: true
        - in: header
          name: x-longitude
          schema:
            type: number
          description: Longitude value for location
          required: true
        - in: header
          name: x-unit
          required: false
          description: System of measurement to use
          schema:
            type: string
            enum:
              - DEFAULT
              - METRIC
              - IMPERIAL
      responses:
        '200':
          description: Weather data for the location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
  /weather/{lat},{lon}:
    get:
      summary: Get the weather data for a given latitude and longitude. Assumes a default measure (SI)
      parameters:
        - in: header
          name: x-libreweather-token
          schema:
            type: string
          description: API Access token
          required: false
        - in: path
          name: lat
          schema:
            type: number
          description: Latitude value for location
          required: true
        - in: path
          name: lon
          schema:
            type: number
          description: Longitude value for location
          required: true
      responses:
        '200':
          description: Weather data for the location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
  /weather/{lat},{lon}/units/{units}:
    get:
      summary: Get the weather data for a given latitude and longitude.
      parameters:
        - in: header
          name: x-libreweather-token
          schema:
            type: string
          description: API Access token
          required: false
        - in: path
          name: lat
          schema:
            type: number
          description: Latitude value for location
          required: true
        - in: path
          name: lon
          schema:
            type: number
          description: Longitude value for location
          required: true
        - in: path
          name: units
          required: true
          description: System of measurement to use
          schema:
            type: string
            enum:
              - DEFAULT
              - METRIC
              - IMPERIAL
      responses:
        '200':
          description: Weather data for the location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Weather'
components:
  schemas:
    Weather:
      type: object
      properties:
        source:
          type: string
          enum:
            - OWM (Open Weather Map)
            - METEO (Open-Meteo)
            - DEFAULT
        current:
          $ref: '#/components/schemas/Current'
        daily:
          type: array
          description: Array of daily weather data, starting with today
          items:
            $ref: '#/components/schemas/Daily'
        hourly:
          type: array
          description: Array of upcoming hourly weather data, starting with the current hour
          items:
            $ref: '#/components/schemas/Hourly'
    Current:
      type: object
      properties:
        apparentTemp:
          description: The 'feels like' temperature
          allOf:
            - $ref: '#/components/schemas/Temperature'
        condition:
          $ref: '#/components/schemas/Condition'
        description:
          type: string
          description: Description of the current weather
        dewPoint:
          description: Dew point temperature
          allOf:
            - $ref: '#/components/schemas/Temperature'
        humidity:
          type: number
          description: Humidity percent
        pressure:
          $ref: '#/components/schemas/Pressure'
        summary:
          type: string
          description: Brief (1-2 word) summary of the current weather
        sunrise:
          type: number
          description: Sunrise time. Unix epoch milliseconds, UTC.
        sunset:
          type: number
          description: Sunset time. Unix epoch milliseconds, UTC.
        temp:
          description: The current temperature
          allOf:
            - $ref: '#/components/schemas/Temperature'
        time:
          type: number
          description: Observation time. Unix epoch milliseconds, UTC.
        uvIndex:
          type: number
          description: Current UV index
        visibility:
          $ref: '#/components/schemas/Visibility'
        windspeed:
          $ref: '#/components/schemas/WindSpeed'
    Daily:
      type: object
      properties:
        apparentTemp:
          $ref: '#/components/schemas/TempRange'
        cloudCover:
          type: number
          description: Cloud cover percent, 0-100
        condition:
          $ref: '#/components/schemas/Condition'
        daylightDuration:
          type: number
          description: Daylight length in seconds
        description:
          type: string
          description: Description of the weather for the day
        dewPoint:
          $ref: '#/components/schemas/Temperature'
        humidity:
          type: number
          description: Humidity percent
        precipHours:
          type: number
          description: Hours with precipitation
        precipProbability:
          type: number
          description: Chance of precipitation, 0-100
        pressure:
          $ref: '#/components/schemas/Pressure'
        rainVolume:
          description: Total rain for the day. Null if none forecast.
          allOf:
            - $ref: '#/components/schemas/Volume'
        snowVolume:
          description: Total snow for the day. Null if none forecast.
          allOf:
            - $ref: '#/components/schemas/Volume'
        sunrise:
          type: number
          description: Sunrise time. Unix epoch milliseconds, UTC.
        sunshineDuration:
          type: number
          description: Sunshine length in seconds
        sunset:
          type: number
          description: Sunset time. Unix epoch milliseconds, UTC.
        temp:
          $ref: '#/components/schemas/TempRange'
        time:
          type: number
          description: Local day start. Unix epoch milliseconds, UTC.
        uvIndex:
          type: number
          description: Daily maximum UV index
        windGust:
          $ref: '#/components/schemas/WindSpeed'
        windspeed:
          $ref: '#/components/schemas/WindSpeed'
    Hourly:
      type: object
      required:
        - condition
        - temp
        - time
      properties:
        apparentTemp:
          description: Feels-like temperature
          allOf:
            - $ref: '#/components/schemas/Temperature'
        cloudCover:
          type: number
          description: Cloud cover percent, 0-100
        condition:
          $ref: '#/components/schemas/Condition'
        description:
          type: string
          description: Text description of the hour's weather
        dewPoint:
          $ref: '#/components/schemas/Temperature'
        humidity:
          type: number
          description: Humidity percent
        precipProbability:
          type: number
          description: Chance of precipitation, 0-100
        precipVolume:
          description: Total liquid-equivalent precipitation for the hour
          allOf:
            - $ref: '#/components/schemas/Volume'
        pressure:
          $ref: '#/components/schemas/Pressure'
        rainVolume:
          $ref: '#/components/schemas/Volume'
        snowVolume:
          $ref: '#/components/schemas/Volume'
        sunshineDuration:
          type: number
          description: Sunshine during this hour, in seconds (0-3600)
        temp:
          $ref: '#/components/schemas/Temperature'
        time:
          type: number
          description: Hour start. Unix epoch milliseconds, UTC.
        uvIndex:
          type: number
          description: UV index
        visibility:
          $ref: '#/components/schemas/Visibility'
        windGust:
          $ref: '#/components/schemas/WindSpeed'
        windspeed:
          $ref: '#/components/schemas/WindSpeed'
    TempRange:
      type: object
      description: Daily temperature range
      properties:
        min:
          $ref: '#/components/schemas/Temperature'
        max:
          $ref: '#/components/schemas/Temperature'
    Condition:
      type: string
      description: The weather condition value
      enum:
        - CLEAR
        - CLOUDY
        - FOG
        - PARTLY_CLOUDY
        - RAIN
        - SLEET
        - SNOW
        - WIND
    Pressure:
      properties:
        value:
          type: number
          description: 'Numeric value of the atmospheric pressure, to a hundredths position'
        unit:
          type: string
          enum:
            - MB (Millibar - DEFAULT)
    Temperature:
      properties:
        value:
          type: number
          description: 'Numeric value of the temperature, to a hundredths precision'
        unit:
          type: string
          enum:
            - K (Kelvin - DEFAULT)
            - C (Celsius - METRIC)
            - F (Fahrenheit - IMPERIAL)
    Visibility:
      properties:
        value:
          type: number
          description: 'Numeric value of the visibility distance, to a hundredths precision'
        unit:
          type: string
          enum:
            - 'M (Meters - DEFAULT, METRIC)'
            - MI (Miles - IMPERIAL)
    WindSpeed:
      properties:
        direction:
          type: string
          description: Direction of the wind
        magnitude:
          type: string
          description: Magnitude of the wind speed
        unit:
          type: string
          enum:
            - 'MS (Meters per second - DEFAULT, METRIC)'
            - MPH (Miles per hour - IMPERIAL)
    Volume:
      properties:
        value:
          type: number
          description: 'Numeric value of the volume, to a hundredths precision'
        unit:
          type: string
          enum:
            - MM (Millimeters - DEFAULT, METRIC)
            - IN (Inches - IMPERIAL)
